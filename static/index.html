<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pose Avatar 3D — YOLO Pose + Three.js</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="8" width="14" height="11" rx="3"/>
          <path d="M12 8V5"/><circle cx="12" cy="3.5" r="1.5"/>
          <circle cx="9" cy="13" r="1.2" fill="currentColor"/>
          <circle cx="15" cy="13" r="1.2" fill="currentColor"/>
          <path d="M9 16.5h6"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>Pose Avatar 3D</h1>
        <p>Controla el robot con tus movimientos</p>
      </div>
    </div>
    <div class="live"><span class="dot"></span> En vivo</div>
  </header>

  <main class="layout">
    <section class="card video-card">
      <div class="card-head">
        <h2>Cámara</h2>
        <span class="tag">YOLO Pose</span>
      </div>
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="stats">FPS: -- | ID: --</div>
        <div class="scan" aria-hidden="true"></div>
      </div>
      <div class="controls">
        <button id="startBtn" class="btn primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          Iniciar Cámara
        </button>
        <div class="select-wrap">
          <select id="camSelect" aria-label="Cámara"></select>
        </div>
        <button id="toggleMirror" class="btn ghost">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 7L4 12l4 5"/><path d="M16 7l4 5-4 5"/></svg>
          Espejo
        </button>
      </div>
    </section>

    <section class="card scene-card">
      <div class="card-head">
        <h2>Avatar</h2>
        <span class="tag">Three.js</span>
      </div>
      <div id="scene"></div>
      <p class="hint">Arrastra para girar · rueda para zoom</p>
    </section>
  </main>

  <footer class="foot">YOLO Pose + Three.js · desplegado en EC2</footer>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
